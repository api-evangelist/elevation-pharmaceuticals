name: Elevation Pharmaceuticals
description: Elevation Pharmaceuticals was a San Diego specialty pharmaceutical company founded in 2008
  by Cam Garner, Bill Gerhart, and Ahmet Tutuncu to develop next-generation aerosol/inhalation therapies
  for chronic obstructive pulmonary disease (COPD). It raised a $30 million Series A in 2010 backed by
  Canaan Partners, TPG Growth, Care Capital, and Mesa Verde Venture Partners, and was acquired by Sunovion
  Pharmaceuticals in August 2012. The company is no longer independently operating; its domain now resolves
  to Sunovion nameservers and it publishes no public API, developer portal, or developer surface. This
  profile is retained in the API Evangelist network as a Canaan Partners portfolio record.
